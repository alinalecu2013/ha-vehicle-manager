blueprint:
  name: "Vehicle Manager: notificări pentru acte"
  description: >
    Trimite pe telefon o notificare când un act (RCA, ITP, rovinietă, CASCO,
    revizie, distribuție, trusă medicală, extinctor, impozit auto, schimb de
    anvelope) se apropie de scadență. Notificarea are un buton care reînnoiește
    actul direct din telefon: actele se prelungesc cu numărul de luni ales,
    schimbul de anvelope cu 6 luni, iar revizia și distribuția se marchează ca
    făcute (următoarea scadență se calculează automat).
  domain: automation
  source_url: https://github.com/alinalecu2013/ha-vehicle-manager/blob/main/blueprints/automation/vehicle_manager/notificare_acte.yaml
  input:
    vehicles:
      name: Vehicule
      description: Vehiculele urmărite.
      selector:
        device:
          integration: vehicle_manager
          multiple: true
    notify_device:
      name: Telefon
      description: Telefonul (aplicația Home Assistant Companion) care primește notificările.
      selector:
        device:
          integration: mobile_app
    days_before:
      name: Când se trimite
      description: Cu câte zile înainte de scadență (0 = în ziua scadenței).
      default: ["30", "7", "1", "0"]
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - label: Cu 60 de zile înainte
              value: "60"
            - label: Cu 30 de zile înainte
              value: "30"
            - label: Cu 14 zile înainte
              value: "14"
            - label: Cu 7 zile înainte
              value: "7"
            - label: Cu 3 zile înainte
              value: "3"
            - label: Cu o zi înainte
              value: "1"
            - label: În ziua scadenței
              value: "0"
    repeat_expired:
      name: Amintește zilnic actele expirate
      description: Trimite câte o notificare în fiecare zi cât timp un act e expirat.
      default: true
      selector:
        boolean:
    notify_time:
      name: Ora notificării
      default: "09:00:00"
      selector:
        time:
    renew_months:
      name: Prelungire acte (RCA, ITP, rovinietă, CASCO...)
      description: Cu câte luni se prelungește actul când apeși butonul din notificare.
      default: 12
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: luni
          mode: box
    service_interval:
      name: Interval revizie
      description: După "Am făcut-o", următoarea revizie e peste atâția km (sau luni, ce vine prima).
      default: 15000
      selector:
        number:
          min: 1000
          max: 60000
          step: 500
          unit_of_measurement: km
          mode: box
    service_months:
      name: Interval revizie (luni)
      default: 12
      selector:
        number:
          min: 1
          max: 48
          unit_of_measurement: luni
          mode: box
    timing_interval:
      name: Interval distribuție
      description: Verifică în cartea service-ului; de obicei 60.000 - 120.000 km.
      default: 90000
      selector:
        number:
          min: 10000
          max: 300000
          step: 5000
          unit_of_measurement: km
          mode: box
    timing_months:
      name: Interval distribuție (luni)
      default: 60
      selector:
        number:
          min: 6
          max: 120
          unit_of_measurement: luni
          mode: box
    open_path:
      name: Pagina deschisă la atingerea notificării
      description: Ex. /lovelace/mașini. Lasă gol pentru pagina principală.
      default: ""
      selector:
        text:

mode: queued
max: 10

triggers:
  - trigger: time
    at: !input notify_time
    id: check
  - trigger: event
    event_type: mobile_app_notification_action
    id: action

variables:
  vehicles: !input vehicles
  days_before: !input days_before
  repeat_expired: !input repeat_expired
  renew_months: !input renew_months
  service_interval: !input service_interval
  service_months: !input service_months
  timing_interval: !input timing_interval
  timing_months: !input timing_months
  open_path: !input open_path
  # Prefixul butoanelor include automatizarea, ca un buton să fie tratat doar de
  # automatizarea care a trimis notificarea (pot există mai multe, ex. 2 telefoane).
  action_prefix: "VM_RENEW|{{ this.entity_id }}|"
  vehicle_entities: >
    {% set ns = namespace(items=[]) %}
    {% for dev in vehicles %}
      {% set ns.items = ns.items + device_entities(dev) | list %}
    {% endfor %}
    {{ ns.items }}

actions:
  - choose:
      # ------------------------------------------------------------ verificare
      - conditions:
          - condition: trigger
            id: check
        sequence:
          - variables:
              due: >
                {% set ns = namespace(items=[]) %}
                {% for dev in vehicles %}
                  {% for entity in device_entities(dev)
                       if entity.startswith('sensor.') and state_attr(entity, 'document_key') %}
                    {% set days = states(entity) | int(none) %}
                    {% if days is not none
                          and ((days | string) in days_before or (repeat_expired and days < 0)) %}
                      {% set ns.items = ns.items + [{
                        'entity': entity,
                        'days': days,
                        'key': state_attr(entity, 'document_key'),
                        'label': state_attr(entity, 'document'),
                        'date': state_attr(entity, 'expira_la'),
                        'vehicle': device_attr(dev, 'name'),
                      }] %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {{ ns.items }}
          - repeat:
              for_each: "{{ due }}"
              sequence:
                - device_id: !input notify_device
                  domain: mobile_app
                  type: notify
                  title: "{{ repeat.item.label }} · {{ repeat.item.vehicle }}"
                  message: >
                    {% set d = repeat.item.days %}
                    {% set data = (repeat.item.date | as_datetime).strftime('%d.%m.%Y')
                                  if repeat.item.date else '' %}
                    {% if d > 1 %}Expiră în {{ d }} zile ({{ data }}).
                    {% elif d == 1 %}Expiră mâine ({{ data }}).
                    {% elif d == 0 %}Expiră azi.
                    {% else %}Expirat de {{ -d }} {{ 'zi' if d == -1 else 'zile' }} ({{ data }}).
                    {% endif %}
                  data:
                    tag: "vehicle_manager_{{ repeat.item.entity }}"
                    url: "{{ open_path if open_path else '/' }}"
                    clickAction: "{{ open_path if open_path else '/' }}"
                    actions:
                      - action: "{{ action_prefix ~ repeat.item.entity }}"
                        title: >
                          {% if repeat.item.key in ['revizie', 'distributie'] %}Am făcut-o
                          {% elif repeat.item.key == 'anvelope' %}Am schimbat (+6 luni)
                          {% else %}Am reînnoit (+{{ renew_months }} luni){% endif %}

      # ------------------------------------------------- butonul din notificare
      - conditions:
          - condition: trigger
            id: action
          - condition: template
            value_template: >
              {{ trigger.event.data.action is string
                 and trigger.event.data.action.startswith(action_prefix)
                 and trigger.event.data.action[action_prefix | length:] in vehicle_entities }}
        sequence:
          - variables:
              entity: "{{ trigger.event.data.action[action_prefix | length:] }}"
              key: "{{ state_attr(entity, 'document_key') }}"
          - if:
              - condition: template
                value_template: "{{ key in ['revizie', 'distributie'] }}"
            then:
              - action: vehicle_manager.mark_service_done
                target:
                  entity_id: "{{ entity }}"
                data:
                  document: "{{ key }}"
                  interval_km: >
                    {{ (timing_interval if key == 'distributie' else service_interval) | int }}
                  interval_months: >
                    {{ (timing_months if key == 'distributie' else service_months) | int }}
            else:
              - action: vehicle_manager.renew_document
                target:
                  entity_id: "{{ entity }}"
                data:
                  document: "{{ key }}"
                  # anvelopele se schimba sezonier, deci următorul schimb e peste 6 luni
                  months: "{{ 6 if key == 'anvelope' else renew_months | int }}"
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            message: clear_notification
            data:
              tag: "vehicle_manager_{{ entity }}"
