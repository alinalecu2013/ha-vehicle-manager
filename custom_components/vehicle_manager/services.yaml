set_mileage:
  target:
    entity:
      integration: vehicle_manager
  fields:
    mileage:
      required: true
      example: 142500
      selector:
        number:
          min: 0
          max: 3000000
          step: 1
          mode: box
          unit_of_measurement: km

set_document:
  target:
    entity:
      integration: vehicle_manager
  fields:
    document:
      required: true
      selector:
        select:
          translation_key: document
          options:
            - rca
            - itp
            - rovinieta
            - revizie
            - distributie
    date:
      selector:
        date:
    km:
      selector:
        number:
          min: 0
          max: 3000000
          step: 1
          mode: box
          unit_of_measurement: km

renew_document:
  target:
    entity:
      integration: vehicle_manager
  fields:
    document:
      required: true
      selector:
        select:
          translation_key: document
          options:
            - rca
            - itp
            - rovinieta
            - revizie
            - distributie
    months:
      default: 12
      selector:
        number:
          min: 1
          max: 120
          step: 1
          mode: box
          unit_of_measurement: luni
    interval_km:
      selector:
        number:
          min: 0
          max: 300000
          step: 500
          mode: box
          unit_of_measurement: km
    cost:
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box

mark_service_done:
  target:
    entity:
      integration: vehicle_manager
  fields:
    document:
      default: revizie
      selector:
        select:
          translation_key: document
          options:
            - revizie
            - distributie
    mileage:
      selector:
        number:
          min: 0
          max: 3000000
          step: 1
          mode: box
          unit_of_measurement: km
    interval_months:
      default: 12
      selector:
        number:
          min: 1
          max: 120
          step: 1
          mode: box
          unit_of_measurement: luni
    interval_km:
      default: 15000
      selector:
        number:
          min: 0
          max: 300000
          step: 500
          mode: box
          unit_of_measurement: km
    cost:
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box

add_expense:
  target:
    entity:
      integration: vehicle_manager
  fields:
    category:
      required: true
      selector:
        select:
          translation_key: expense_category
          options:
            - rca
            - itp
            - rovinieta
            - revizie
            - distributie
            - reparatii
            - anvelope
            - combustibil
            - spalare
            - parcare
            - amenzi
            - taxe
            - accesorii
            - altele
    amount:
      required: true
      example: 850
      selector:
        number:
          min: 0
          max: 10000000
          step: 0.01
          mode: box
    date:
      selector:
        date:
    mileage:
      selector:
        number:
          min: 0
          max: 3000000
          step: 1
          mode: box
          unit_of_measurement: km
    note:
      example: Schimb placute frana fata
      selector:
        text:

delete_expense:
  fields:
    expense_id:
      required: true
      selector:
        text:
